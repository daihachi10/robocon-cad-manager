name: Release
on:
  push:
    tags: [ 'v*' ]
jobs:
  windows-release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-release --config Release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw 'Inno Setup signature validation failed.' }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          if (-not (Test-Path "$installDir\ISCC.exe")) { throw 'ISCC.exe was not installed.' }
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\packaging\create-release.ps1 -Version $version
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RoboconCadManagerSetup.exe
            dist/update.json
