name: Release
on:
  push:
    tags: [ 'v*' ]
jobs:
  windows-release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-release --config Release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile $installer
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\packaging\create-release.ps1 -Version $version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RoboconCadManagerSetup-${{ env.RELEASE_VERSION }}.exe
            dist/update.json
